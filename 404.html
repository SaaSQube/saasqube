<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | SaaSQube Solutions</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- Self-contained on purpose: this page is served at any URL depth
       (and under /<repo>/ on GitHub Pages), so relative asset paths can't be relied on. -->
  <style>
    :root { --brand: #4f46e5; --accent: #f59e0b; --ink: #0f172a; --ink-2: #334155; --bg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #6366f1; --ink: #eef2ff; --ink-2: #cbd5e1; --bg: #0b0b1a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink-2); background: var(--bg); }
    main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    h1 {
      font-size: clamp(4rem, 14vw, 8rem); margin: 0; font-weight: 800; letter-spacing: -.03em;
      background: linear-gradient(100deg, var(--brand) 10%, #8b5cf6 50%, var(--accent) 95%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    a {
      display: inline-block; margin-top: 8px; padding: 15px 26px; border-radius: 999px;
      background: var(--brand); color: #fff; font-weight: 600; text-decoration: none;
    }
    a:hover { filter: brightness(.92); }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>404</h1>
      <p>Sorry, we couldn't find that page.</p>
      <a href="/" id="home">Back to home</a>
    </div>
  </main>
  <script>
    // On a GitHub Pages project site (user.github.io/repo/), home is /repo/, not /.
    if (location.hostname.endsWith("github.io")) {
      var seg = location.pathname.split("/")[1];
      if (seg) document.getElementById("home").href = "/" + seg + "/";
    }
  </script>
</body>
</html>
